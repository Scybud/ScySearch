<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scybud Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!--SCYBUD UI CORE-->
<link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/variables.css" />

<link rel="stylesheet" href="css/base.css">
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="mark">S</div>
    <span>Scybud <span class="searchWord" style="color:var(--accent)">Search</span></span>
  </div>
  <div class="topbar-actions">
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light and dark theme"></button>
  </div>
</div>

<!-- HOME -->
<div class="home-wrap" id="homeWrap">
  <div class="home-mark">S</div>
  <h1 class="home-title">Scybud Search</h1>
  <p class="home-sub">Find things across the whole build, fast.</p>

  <div class="search-shell">
    <div class="search-bar" id="homeSearchBar">
      <svg class="icon-search" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" class="search-input" id="homeInput" placeholder="Search Scybud, or anything else" autocomplete="off">
      <button class="clear-btn" id="homeClear" aria-label="Clear search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <button class="mic-btn" aria-label="Search by voice">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg>
      </button>
    </div>
    <div class="suggest-panel" id="homeSuggest"></div>
  </div>

  <div class="search-actions">
    <button class="btn primary" id="searchBtn">Search</button>
    <button class="btn" id="feelingLuckyBtn">I'm Feeling Lucky</button>
  </div>

  <div class="trending-wrap">
    <div class="trending-label">Trending now</div>
    <div class="trending-chips" id="trendingChips"></div>
  </div>
</div>

<!-- RESULTS -->
<div class="results-wrap" id="resultsWrap">
  <div class="results-header">
    <div class="results-searchbar">
      <div class="logo"><div class="mark">S</div><span>Scybud</span></div>
      <div class="results-search-shell">
        <div class="search-bar" id="resultsSearchBar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" class="search-input" id="resultsInput" autocomplete="off">
          <button class="clear-btn" id="resultsClear" aria-label="Clear search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="suggest-panel" id="resultsSuggest"></div>
      </div>
    </div>
    <div class="tabs" id="tabsRow">
      <button class="tab active" data-tab="all">All</button>
      <button class="tab" data-tab="news">News</button>
      <button class="tab" data-tab="images">Images</button>
      <button class="tab" data-tab="videos">Videos</button>
      <button class="tab" data-tab="discussions">Discussions</button>
    </div>
  </div>

  <div class="meta-row">
    <span id="resultStats">—</span>
    <div class="filter-chips" id="filterChips"></div>
  </div>

  <div class="results-body">
    <div class="results-list" id="resultsList"></div>
    <div class="knowledge-panel" id="knowledgePanel" style="display:none;"></div>
  </div>

  <div class="pagination" id="pagination"></div>
</div>

<script type="module" src="js/index.js"></script>
</body>
</html>
